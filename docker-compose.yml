version: '3.8'

services:
  # API Servisi
  api:
    build: .
    container_name: devops-demo-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - devops-network
    restart: always

  # PostgreSQL Veritabanı Servisi
  db:
    image: postgres:15-alpine
    container_name: devops-demo-db
    environment:
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password123}
      - POSTGRES_DB=${DB_NAME:-devops_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  postgres_data:
